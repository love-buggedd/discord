services:
  school-bot:
    build: ./school-bot
    restart: unless-stopped
    env_file:
      - ./school-bot/.env
  ollama:
    image: ollama/ollama
    restart: unless-stopped
    volumes:
      - ollama_data:/root/.ollama
      - ./ollama-entrypoint.sh:/entrypoint.sh

    entrypoint: ["/bin/sh", "/entrypoint.sh"]
    healthcheck:
      test: ["CMD", "sh", "-c", "ollama list | grep llama3.2:3b"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
  ivan:
    build: ./ivan
    restart: unless-stopped
    env_file:
      - ./ivan/.env
    environment:
      - OLLAMA_HOST=http://ollama:11434
    depends_on:
      ollama:
        condition: service_healthy
volumes:
  ollama_data: